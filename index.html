<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapido Captain Delivery App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>Rapido Captain</h1>
  </header>

  <main style="padding: 20px; margin-top: 60px;">
    <h2>Welcome, Driver</h2>
    <p>Your status is currently online.</p>
  </main>

  <!-- New Delivery Order Card -->
  <div class="order-card">
    <h3>New Delivery Request</h3>
    <p><strong>Pickup:</strong> Madhapur Metro Station</p>
    <p><strong>Drop:</strong> Gachibowli Financial District</p>
    <p><strong>Fare:</strong> ₹145</p>
    <button id="accept-btn">Accept Ride</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
